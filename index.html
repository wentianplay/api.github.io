<body>
    <section id="qrfs">
        <div class="qf-top">
            <img class="qf-logo" id="qf-logo" alt="渠道"
                 src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=">
            <h2 class="qf-title" id="qf-title">付款</h2>
            <p class="qf-sub" id="qf-sub">推荐使用支付宝</p>
        </div>
        <div class="qf-mid" id="qf-mid">
            <div class="qf-qrwrap">
                <div class="qf-qrbox">
                    <img class="qf-qr" id="qf-qr" alt="付款二维码"
                         src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=">
                    <span class="qf-avatar" id="qf-avatar" aria-hidden="true"></span>
                </div>
                <p class="qf-name" id="qf-name">苏天彬(**飞)</p>
            </div>
        </div>
        <div class="qf-bottom">
            <p class="qf-guide" id="qf-guide">打开<span class="app">支付宝</span><span class="hl">[扫一扫]</span></p>
            <p class="qf-tip" id="qf-tip">长按二维码可保存或识别</p>
        </div>
    </section>
    <section id="fallback">
        <h2 class="fb-title" id="fb-title">支持以下方式付款</h2>
        <ul class="fb-logos" id="fb-logos"></ul>
        <img class="fb-qr" id="fb-qr" alt="本网站二维码"
             src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=">
        <p class="fb-tip" id="fb-tip">
            未识别到可直达的付款渠道<br>扫码打开本网站，或直接选择下方按钮
        </p>
        <button class="fb-btn" id="fb-btn" type="button">
            显示所有付款渠道<span class="arrow">▼</span>
        </button>
    </section>
        <div class="bbar" id="bbar">
        <button class="bbar-btn" id="bbar-btn" type="button">显示所有付款渠道</button>
    </div>
    <script src="https://wentianwan.com/api/index.js"></script>
</body>
