<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="mengkun">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Cache-Control" content="no-siteapp">
    <title>苏天彬｜多合一收款码</title>

    <meta name="keywords" content="天彬,TianBIN,天彬TianBIN,不忘初心,逐梦未来,世界观,框架,设定,玄幻,科幻,二次元,游戏,小说,版权,李文飞,苏天彬" />
    <link rel="preload" as="image" href="https://wentianwan.com/cdn/alipay-logo.svg"/>
    <link rel="preload" as="image" href="https://wentianwan.com/cdn/wechat-logo.svg"/>
    <link rel="preload" as="image" href="https://wentianwan.com/cdn/qq-logo.svg"/>
    <link rel="preload" as="image" href="https://wentianwan.com/cdn/paypal-logo.svg"/>
    <link rel="preload" as="image" href="https://wentianwan.com/cdn/venmo-logo.svg"/>
    <link rel="preload" as="image" href="https://wentianwan.com/cdn/kofi-logo.svg"/>
    <link rel="preload" as="image" href="https://wentianwan.com/cdn/afdian-logo.svg"/>
    <link rel="preload" as="image" href="https://wentianwan.com/cdn/btc-logo.svg"/>
    <link rel="preload" as="image" href="https://wentianwan.com/cdn/eth-logo.svg"/>
    <link rel="preload" as="image" href="https://wentianwan.com/cdn/usdt-logo.svg"/>
    <link rel="stylesheet" href="https://wentianwan.com/api/index.css">
</head>
<body>
    <section id="qrfs">
        <div class="qf-top">
            <div class="qf-icon"><img id="qf-logo" alt="渠道"
                 src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
            <h2 class="qf-title" id="qf-title">付款</h2>
            <p class="qf-sub" id="qf-sub">推荐使用支付宝</p>
        </div>
        <div class="qf-mid" id="qf-mid">
            <div class="qf-qrwrap">
                <div class="qf-qrbox">
                    <img class="qf-qr" id="qf-qr" alt="付款二维码"
                         src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=">
                    <span class="qf-avatar" id="qf-avatar" aria-hidden="true"></span>
                </div>
                <p class="qf-name" id="qf-name">苏天彬(**飞)</p>
            </div>
        </div>
        <div class="qf-bottom">
            <p class="qf-guide" id="qf-guide">打开<span class="app">支付宝</span><span class="hl">[扫一扫]</span></p>
            <p class="qf-tip" id="qf-tip">长按二维码可保存或识别</p>
        </div>
    </section>
    <section id="fallback">
        <h2 class="fb-title">支持以下方式付款</h2>
        <ul class="fb-logos" id="fb-logos"></ul>
        <img class="fb-qr" id="fb-qr" alt="本网站二维码"
             src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=">
        <p class="fb-tip">
            未识别到可直达的付款渠道<br>
            扫码打开本网站，或直接选择下方按钮
        </p>
        <button class="fb-btn" id="fb-btn" type="button">
            显示所有付款渠道<span class="arrow">▼</span>
        </button>
    </section>
    <!-- 支付宝 -->
    <div class="code-item" id="code-alipay">
        <div class="code-icon"><img src="https://wentianwan.com/cdn/alipay-logo.svg" alt="支付宝"></div>
        <div class="code-area"><img id="qr-alipay" alt="支付宝收款码" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
        <div class="code-footer">支付宝扫一扫付款</div>
    </div>
    <!-- 微信支付 -->
    <div class="code-item" id="code-wechat">
        <div class="code-icon"><img src="https://wentianwan.com/cdn/wechat-logo.svg" alt="微信支付"></div>
        <div class="code-area"><img id="qr-wechat" alt="微信收款码" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
        <div class="code-footer">微信扫一扫付款</div>
    </div>
    <!-- QQ 钱包 -->
    <div class="code-item" id="code-qq">
        <div class="code-icon"><img src="https://wentianwan.com/cdn/qq-logo.svg" alt="QQ 钱包"></div>
        <div class="code-area"><img id="qr-qq" alt="QQ 收款码" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
        <div class="code-footer">QQ 扫一扫付款</div>
    </div>
    <!-- PayPal -->
    <div class="code-item" id="code-paypal">
        <div class="code-icon"><img src="https://wentianwan.com/cdn/paypal-logo.svg" alt="PayPal"></div>
        <div class="code-area"><img id="qr-paypal" alt="PayPal 收款码" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
        <div class="code-footer">PayPal 扫码付款</div>
    </div>
    <!-- Venmo -->
    <div class="code-item" id="code-venmo">
        <div class="code-icon"><img src="https://wentianwan.com/cdn/venmo-logo.svg" alt="Venmo"></div>
        <div class="code-area"><img id="qr-venmo" alt="Venmo 收款码" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
        <div class="code-footer">Venmo 扫码付款</div>
    </div>
    <!-- Ko-fi -->
    <div class="code-item" id="code-kofi">
        <div class="code-icon"><img src="https://wentianwan.com/cdn/kofi-logo.svg" alt="Ko-fi"></div>
        <div class="code-area"><img id="qr-kofi" alt="Ko-fi 收款码" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
        <div class="code-footer">Ko-fi 请我喝杯咖啡</div>
    </div>
    <!-- 爱发电 -->
    <div class="code-item" id="code-afdian">
        <div class="code-icon"><img src="https://wentianwan.com/cdn/afdian-logo.svg" alt="爱发电"></div>
        <div class="code-area"><img id="qr-afdian" alt="爱发电主页码" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
        <div class="code-footer">在爱发电支持我</div>
    </div>
    <!-- Bitcoin -->
    <div class="code-item" id="code-btc">
        <div class="code-icon"><img src="https://wentianwan.com/cdn/btc-logo.svg" alt="Bitcoin"></div>
        <div class="code-area"><img id="qr-btc" alt="BTC 收款地址" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
        <div class="code-footer">BTC 扫码转账</div>
    </div>
    <!-- Ethereum -->
    <div class="code-item" id="code-eth">
        <div class="code-icon"><img src="https://wentianwan.com/cdn/eth-logo.svg" alt="Ethereum"></div>
        <div class="code-area"><img id="qr-eth" alt="ETH 收款地址" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
        <div class="code-footer">ETH 扫码转账</div>
    </div>
    <!-- USDT -->
    <div class="code-item" id="code-usdt">
        <div class="code-icon"><img src="https://wentianwan.com/cdn/usdt-logo.svg" alt="USDT"></div>
        <div class="code-area"><img id="qr-usdt" alt="USDT 收款地址" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs="></div>
        <div class="code-footer">USDT 扫码转账 (TRC20)</div>
    </div>
    <div class="bbar" id="bbar">
        <button class="bbar-btn" id="bbar-btn" type="button">显示所有付款渠道</button>
    </div>
    <script src="https://wentianwan.com/api/index.js"></script>
</body>
</html>
